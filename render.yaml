services:
  - type: web
    name: busbar-webapp-embedded-v2
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PRICE_DATA_DIR
        value: ./data
      - key: CORS_ALLOWED_ORIGINS
        value: https://hansrisnes.github.io
      - key: CORS_ALLOW_LOCALHOST
        value: "false"
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: OAUTH_TENANT_ID
        sync: false
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: MAIL_TO
        sync: false
    disk:
      name: busbar-data
      mountPath: /var/data
      sizeGB: 1
